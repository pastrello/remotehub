[package]
name = "remotehub"
version = "0.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
base64 = "0.22"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# IronRDP client engine: TLS must be enabled explicitly; client does not enforce
# certificate checks by default, so rdp_engine.rs sets Strict validation.
ironrdp = { version = "0.17.0", default-features = false, features = ["client", "pdu", "rustls"] }
ironrdp-tls = { version = "0.2.2", features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
